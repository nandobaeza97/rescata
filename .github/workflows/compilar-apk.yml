# Compila el APK en los servidores de GitHub (no hace falta Android Studio)
# y lo publica en la pestaña "Releases" del repositorio, desde donde se descarga en el móvil.
name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests del motor
        run: ./gradlew :core:test

      - name: Compilar APK
        run: ./gradlew :app:assembleDebug

      - name: Renombrar
        run: cp app/build/outputs/apk/debug/app-debug.apk Rescata.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Rescata-apk
          path: Rescata.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rescata (compilación ${{ github.run_number }})
          files: Rescata.apk
