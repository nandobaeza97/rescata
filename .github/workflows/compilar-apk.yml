# 1) Tests del motor + APK  2) Prueba completa en emuladores Android reales
# 3) Solo si todo pasa, publica el APK en "Releases".
# En los pull requests se compila y se prueba igual, pero no se publica nada ni se tocan las
# ramas ci-resultados-api-* (los resultados quedan como artefactos de la ejecución).
name: Compilar y probar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Un push nuevo a un pull request cancela la prueba anterior del mismo PR (ahorra minutos de CI).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    name: Tests del motor y APK
    runs-on: ubuntu-24.04
    env:
      # Los secretos no se pueden usar directamente en un «if»: se pasan a una variable
      HAS_UPLOAD_KEY: ${{ secrets.RESCATA_UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # APK de pruebas (firmado con la clave de depuración, como siempre)
      - name: Tests del motor y compilación
        run: ./gradlew :core:test :app:assembleRelease
      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk Rescata.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Rescata-apk
          path: Rescata.apk
          retention-days: 30
      # AAB para Google Play, firmado con la clave de subida (solo si están sus secretos en GitHub)
      - name: AAB firmado para Google Play
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RESCATA_UPLOAD_KEYSTORE_BASE64 }}
          RESCATA_UPLOAD_STORE_PASSWORD: ${{ secrets.RESCATA_UPLOAD_STORE_PASSWORD }}
          RESCATA_UPLOAD_KEY_ALIAS: ${{ secrets.RESCATA_UPLOAD_KEY_ALIAS }}
          RESCATA_UPLOAD_KEY_PASSWORD: ${{ secrets.RESCATA_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          RESCATA_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew :app:bundleRelease
          rm -f "$RUNNER_TEMP/upload.jks"
          cp app/build/outputs/bundle/release/app-release.aab Rescata.aab
          jarsigner -verify Rescata.aab
      # Mientras no existan los secretos, se comprueba que la firma funciona con una clave temporal
      # (se crea y se borra en esta ejecución; el AAB resultante no se guarda)
      - name: Comprobar la firma con una clave temporal
        if: env.HAS_UPLOAD_KEY != 'true'
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/temporal.jks" -alias upload -keyalg RSA -keysize 2048 \
            -validity 1 -storepass temporal123 -keypass temporal123 -dname "CN=Prueba CI"
          RESCATA_UPLOAD_STORE_FILE="$RUNNER_TEMP/temporal.jks" RESCATA_UPLOAD_STORE_PASSWORD=temporal123 \
            RESCATA_UPLOAD_KEY_ALIAS=upload RESCATA_UPLOAD_KEY_PASSWORD=temporal123 ./gradlew :app:bundleRelease
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          rm -f "$RUNNER_TEMP/temporal.jks" app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: Rescata-aab
          path: Rescata.aab
          retention-days: 30

  emulador:
    name: Emulador Android API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [28, 29, 33, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prueba de extremo a extremo
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/e2e.sh
      - name: Guardar resultados en una rama (capturas, informe y logs)
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/res
          cp -r capturas /tmp/res/ 2>/dev/null || true
          cp -r app/build/reports/androidTests /tmp/res/informe 2>/dev/null || true
          cp -r app/build/outputs/androidTest-results /tmp/res/resultados 2>/dev/null || true
          cd /tmp/res
          git init -q -b main
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "Resultados emulador API ${{ matrix.api }} (ejecución ${{ github.run_number }})" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-resultados-api-${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulador-api-${{ matrix.api }}
          retention-days: 7
          path: |
            capturas/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  publicar:
    name: Publicar APK
    needs: [apk, emulador]
    # Solo lo que ya está en main se publica en Releases
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Rescata-apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rescata (compilación ${{ github.run_number }}, probada en Android 9, 10, 13 y 16)
          files: Rescata.apk
