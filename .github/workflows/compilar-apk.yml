# 1) Tests del motor + APK  2) Prueba completa en emuladores Android reales
# 3) Solo si todo pasa, publica el APK en "Releases".
name: Compilar y probar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Tests del motor y APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests del motor y compilación
        run: ./gradlew :core:test :app:assembleRelease
      - name: Renombrar
        run: cp app/build/outputs/apk/release/app-release.apk Rescata.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Rescata-apk
          path: Rescata.apk

  emulador:
    name: Emulador Android API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [29, 33, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prueba de extremo a extremo
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulador-api-${{ matrix.api }}
          path: |
            capturas/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  publicar:
    name: Publicar APK
    needs: [apk, emulador]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Rescata-apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rescata (compilación ${{ github.run_number }}, probada en Android 10, 13 y 16)
          files: Rescata.apk
